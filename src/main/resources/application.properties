#spring.datasource.dynamic.datasource.db2.url=jdbc:mysql://localhost:3306/acc-dz?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8
#spring.datasource.dynamic.datasource.db2.username=root
