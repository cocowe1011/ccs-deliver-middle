spring.datasource.dynamic.datasource.db2.password=12345
spring.datasource.dynamic.datasource.db2.driver-class-name=com.mysql.cj.jdbc.Driver
# 连不上时最多等 5 秒并抛错，避免 Tomcat 线程停在 Druid.takeLast
spring.datasource.dynamic.druid.max-wait=5000
spring.datasource.dynamic.druid.connection-error-retry-attempts=1
spring.datasource.dynamic.druid.initial-size=0
spring.datasource.dynamic.druid.min-idle=0
spring.datasource.dynamic.druid.max-active=20
spring.datasource.dynamic.druid.test-while-idle=true
spring.datasource.dynamic.druid.validation-query=SELECT 1

