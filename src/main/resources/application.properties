spring.datasource.dynamic.datasource.db2.url=jdbc:mysql://192.168.0.6:3307/acc-dz?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&connectTimeout=5000&socketTimeout=10000
